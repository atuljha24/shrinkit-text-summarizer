<!DOCTYPE html>
<html>
<head>
  <title>ShrinkIt</title>
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin: 10px 0;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }
    #summary {
      margin-top: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 4px;
      display: none;
    }
    .loading {
      text-align: center;
      margin: 10px 0;
      display: none;
    }
  </style>
</head>
<body>
  <h2>ShrinkIt Text Summarizer</h2>
  <textarea id="input" placeholder="Enter or paste text to summarize..."></textarea>
  <button id="summarize">Summarize</button>
  <div class="loading">Summarizing...</div>
  <div id="summary"></div>
  <script src="popup.js"></script>
</body>
</html>
