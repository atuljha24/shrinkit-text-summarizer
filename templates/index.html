<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShrinkIt Text Summarizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .summary-box {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">ShrinkIt Text Summarizer</h1>
        
        <form id="summarizeForm">
            <div class="mb-3">
                <label for="text" class="form-label">Enter your text:</label>
                <textarea class="form-control" id="text" rows="6" required></textarea>
            </div>
            
            <div class="row mb-3">
                <div class="col">
                    <label for="algorithm" class="form-label">Algorithm:</label>
                    <select class="form-select" id="algorithm">
                        <option value="textrank">TextRank</option>
                        <option value="tfidf">TF-IDF</option>
                        <option value="frequency">Frequency-based</option>
                    </select>
                </div>
                <div class="col">
                    <label for="n_sentences" class="form-label">Number of sentences:</label>
                    <input type="number" class="form-control" id="n_sentences" min="1" max="10" value="5">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Summarize</button>
        </form>
        
        <div class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Generating summary...</p>
        </div>
        
        <div id="summary" class="summary-box" style="display: none;">
            <h4>Summary:</h4>
            <p id="summaryText"></p>
        </div>
    </div>

    <script>
        document.getElementById('summarizeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const text = document.getElementById('text').value;
            const algorithm = document.getElementById('algorithm').value;
            const n_sentences = document.getElementById('n_sentences').value;
            
            // Show loading
            document.querySelector('.loading').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            
            try {
                const response = await fetch('/summarize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text,
                        algorithm,
                        n_sentences
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('summaryText').textContent = data.summary;
                    document.getElementById('summary').style.display = 'block';
                } else {
                    alert(data.error || 'An error occurred');
                }
            } catch (error) {
                alert('An error occurred while generating the summary');
            } finally {
                document.querySelector('.loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
